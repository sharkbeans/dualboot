name: Release

# On a v* tag: build DualBootSwitcher.exe and dualboot-switcher.deb and publish
# them as a GitHub Release (marked pre-release when the tag has a "-", like
# v0.1.0-rc1). The files have no version in their names, so
# .../releases/latest/download/<file> always points at the newest release.
#
# Run by hand (Actions > Release > Run workflow): build both and attach them to
# the run as downloadable artifacts, without creating a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: sed -i "s/^__version__ = .*/__version__ = \"${GITHUB_REF_NAME#v}\"/" dualboot_switcher/__init__.py
      - run: python -m unittest
      - run: python -m pip install pyinstaller==6.11.1
      - run: ./packaging/windows/build-exe.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/DualBootSwitcher.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/^__version__ = .*/__version__ = \"${GITHUB_REF_NAME#v}\"/" dualboot_switcher/__init__.py
      - run: python3 -m unittest
      - run: ./packaging/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/dualboot-switcher.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DOWNLOAD="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          {
            echo "## Download"
            echo
            echo "- **Windows 10/11:** [DualBootSwitcher.exe]($DOWNLOAD/DualBootSwitcher.exe). Double-click it, nothing to install."
            echo "- **Linux** (Debian, Ubuntu, Linux Mint, LMDE): [dualboot-switcher.deb]($DOWNLOAD/dualboot-switcher.deb). Double-click it, or run \`sudo apt install ./dualboot-switcher.deb\`."
            echo
            echo "No Git or Python needed. See the [README](https://github.com/$GITHUB_REPOSITORY#readme) for details and the \"Didn't work?\" section."
            echo
            echo "<details><summary>SHA-256 checksums</summary>"
            echo
            echo '```'
            (cd dist && sha256sum -- *)
            echo '```'
            echo
            echo "</details>"
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" --jq .body
          } > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/DualBootSwitcher.exe dist/dualboot-switcher.deb \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md $PRERELEASE
